name: gymsas_payments
description: Provider-neutral payment checkout module for GymSAS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gymsas.gymsas_payments
        pluginClass: GymsasPaymentsPlugin
      ios:
        pluginClass: GymsasPaymentsPlugin
